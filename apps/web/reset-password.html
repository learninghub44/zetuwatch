<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="api-base" content="/api"><title>Reset password — ZetuWatch</title><style>
:root{font-family:Inter,"DM Sans",system-ui,sans-serif;color:#17211d;background:#f6f8f5}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(430px,100%);background:#fff;border:1px solid #e3e9e4;border-radius:17px;padding:32px;box-shadow:0 18px 50px #14271e0c}.brand{font-weight:750;font-size:19px}.mark{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#16794b;color:#fff;margin-right:8px}.muted{color:#68766e;font-size:14px;line-height:1.6}label{display:block;font-size:12px;font-weight:650;margin:18px 0 7px}input{width:100%;padding:13px;border:1px solid #dce4dd;border-radius:9px;font:inherit}button{width:100%;border:0;border-radius:9px;background:#16794b;color:white;padding:13px;font:650 14px system-ui;margin-top:22px;cursor:pointer}.notice{padding:12px;border-radius:9px;background:#edf3ee;color:#365943;font-size:13px;margin-top:16px}.error{background:#fff0ed;color:#a33d2c}a{color:#16794b;text-decoration:none;font-size:13px}
</style></head><body><main class="card"><a class="brand" href="./index.html"><span class="mark">⌁</span>ZetuWatch</a><h1 style="font-size:28px;letter-spacing:-1px;margin:32px 0 8px">Choose a new password</h1><p class="muted">Set a new password for your account. Reset links expire after one hour and can only be used once.</p><form id="form"><label for="password">New password</label><input id="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><label for="confirm">Confirm new password</label><input id="confirm" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><button id="submit">Update password</button></form><div id="notice" class="notice" role="status" aria-live="polite" hidden></div><p style="margin-top:22px"><a href="./auth.html">Back to sign in</a></p></main><script>
const API=(document.querySelector('meta[name="api-base"]')?.content||"/api").replace(/\/$/,"");const token=new URLSearchParams(location.search).get("token");const form=document.getElementById("form"),notice=document.getElementById("notice"),button=document.getElementById("submit");
if(!token){form.hidden=true;notice.hidden=false;notice.textContent="This password reset link is missing or invalid."}
form.addEventListener("submit",async e=>{e.preventDefault();const p=document.getElementById("password").value,c=document.getElementById("confirm").value;if(p!==c){notice.hidden=false;notice.className="notice error";notice.textContent="The passwords do not match.";return}button.disabled=true;button.textContent="Updating…";try{const r=await fetch(API+"/auth/password-reset/confirm",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({token,password:p})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error==="INVALID_OR_EXPIRED_TOKEN"?"This link has expired or has already been used. Request a new one.":"We couldn't update your password.");form.hidden=true;notice.hidden=false;notice.textContent="Password updated. You can now sign in."; }catch(err){notice.hidden=false;notice.className="notice error";notice.textContent=err.message}finally{button.disabled=false;button.textContent="Update password"}});
</script></body></html>
